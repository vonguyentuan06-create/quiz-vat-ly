<style>
:root{--p:#2563eb;--p2:#7c3aed;--bg:#f4f7fb;--card:#fff;--ok:#16a34a;--bad:#dc2626;--text:#172033}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eff6ff,#f5f3ff);color:var(--text)}
header{background:linear-gradient(120deg,var(--p),var(--p2));color:white;padding:28px 18px;text-align:center}

.wrap{max-width:1000px;margin:24px auto;padding:0 16px 50px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stat{background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 4px 16px #0001;font-weight:bold}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:bold;cursor:pointer;background:var(--p);color:#fff}.btn.secondary{background:#64748b}
.card{background:var(--card);border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 6px 20px #1e293b12;border:1px solid #e8edf5}
.badge{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:bold;margin-bottom:8px}
.q{font-size:17px;font-weight:700;line-height:1.45;margin:5px 0 14px}
.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #dbe3ee;border-radius:12px;padding:12px;cursor:pointer;transition:.2s}.opt:hover{border-color:var(--p);background:#f8fbff}.opt input{margin-top:3px}

select{padding:8px;border-radius:8px;border:1px solid #cbd5e1;margin-left:8px}
.result{display:none;position:sticky;bottom:12px;background:#0f172a;color:white;padding:16px;border-radius:16px;box-shadow:0 10px 30px #0003}.review.good{border-left:6px solid var(--ok)}.review.bad{border-left:6px solid var(--bad)}
small{color:#64748b}.footer{text-align:center;color:#64748b;margin-top:20px}
@media(max-width:600px){.card{padding:16px}.q{font-size:16px}}
</style>
</head>

function norm(x){return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()}
function render(){
document.getElementById('total').textContent=qs.length;
const root=document.getElementById('quiz');root.innerHTML='';
qs.forEach((x,i)=>{
 let h=`<div class="card" id="card${i}"><div class="badge">Câu ${i+1} • ${x.topic}</div><div class="q">${x.q}</div>`;
 if(x.t==='mc'){h+=`<div class="options">`+x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="updateDone()"> <span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')+`</div>`}
 if(x.t==='short'){h+=`<input type="text" id="q${i}" placeholder="Nhập câu trả lời..." oninput="updateDone()">`}
 if(x.t==='tf'){h+=`<div class="tf">`+x.s.map((z,j)=>`<div class="statement">${j+1}. ${z[0]} <select id="q${i}_${j}" onchange="updateDone()"><option value="">-- Chọn --</option><option value="true">Đúng</option><option value="false">Sai</option></select></div>`).join('')+`</div>`}
 h+=`</div>`;root.innerHTML+=h;
});
}
function updateDone(){
let n=0;qs.forEach((x,i)=>{if(x.t==='mc'&&document.querySelector(`input[name=q${i}]:checked`))n++;if(x.t==='short'&&document.getElementById(`q${i}`).value.trim())n++;if(x.t==='tf'&&x.s.every((_,j)=>document.getElementById(`q${i}_${j}`).value!==''))n++;});
document.getElementById('done').textContent=n;
}
function grade(){
let score=0, details=[];
qs.forEach((x,i)=>{
let ok=false,ans='';
if(x.t==='mc'){let el=document.querySelector(`input[name=q${i}]:checked`);ok=!!el&&Number(el.value)===x.a;ans='Đáp án: '+String.fromCharCode(65+x.a)+'. '+x.o[x.a]}
if(x.t==='short'){let v=norm(document.getElementById(`q${i}`).value);ok=x.a.map(norm).includes(v);ans='Đáp án gợi ý: '+x.a[0]}

});
const pct=(score/qs.length*100).toFixed(1);
document.getElementById('scoreLive').textContent=`${score}/${qs.length} (${pct}%)`;
let msg=pct>=80?'Xuất sắc! 🌟':pct>=60?'Khá tốt! 👍':'Hãy xem lại kiến thức và thử lại nhé! 💪';
